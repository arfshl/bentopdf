name: Deploy static content to Pages

on:
  workflow_dispatch:
    inputs:
      bentopdf_version:
        description: "BentoPDF version to deploy (e.g. 2.8.8)"
        required: true
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

env:
  SIMPLE_MODE: "true"
  BASE_URL: "bentopdf"
  SITE_URL: "https://arfshl.github.io/bentopdf"
  HUSKY: "0"

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set BentoPDF version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "BENTOPDF_VERSION=${{ inputs.bentopdf_version }}" >> "$GITHUB_ENV"
          else
           exit 0
          fi

      - name: Download and Extract specific source code release
        run: |
          curl -L https://github.com/alam00000/bentopdf/archive/refs/tags/v${BENTOPDF_VERSION}.tar.gz -o bentopdf.tar.gz
          tar -xzf bentopdf.tar.gz --strip-components=1
          rm bentopdf.tar.gz

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "lts/*"

      - name: Install dependencies
        run: npm ci

      - name: Build distribution
        env:
          SIMPLE_MODE: "true"
          BASE_URL: "bentopdf"
          SITE_URL: "https://arfshl.github.io/bentopdf"
          HUSKY: "0"
        run: |
          npm run build
          
      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist
          name: github-pages-deployment

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages-deployment