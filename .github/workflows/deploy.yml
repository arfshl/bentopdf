# Workflow untuk deploy BentoPDF dari Source Tag v2.8.8 ke GitHub Pages
name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

env:
  SIMPLE_MODE: "true"
  BASE_URL: "bentopdf"
  SITE_URL: "https://arfshl.github.io/bentopdf"
  HUSKY: "0"

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # 1. Download & Extract Source Code spesifik v2.8.8
      - name: Download and Extract specific source code release
        run: |
          curl -L https://github.com/alam00000/bentopdf/archive/refs/tags/v2.8.8.tar.gz -o bentopdf.tar.gz
          tar -xzf bentopdf.tar.gz --strip-components=1
          rm bentopdf.tar.gz

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "lts/*"

      - name: Install dependencies
        run: npm ci

      # 2. Build dari source dengan menyertakan BASE_URL dan melewati SEO audit
      - name: Build distribution
        run: |
            export SIMPLE_MODE: "true"
            export BASE_URL: "bentopdf"
            export SITE_URL: "https://arfshl.github.io/bentopdf"
            export HUSKY: "0"
            npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
          name: github-pages-deployment

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages-deployment
